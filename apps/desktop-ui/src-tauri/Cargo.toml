[package]
name = "sentinel-av"
version = "0.1.0"
description = "Sentinel AV Desktop Application"
authors = ["Sentinel AV Team"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "sentinel_av_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sentinel-av"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = ["tray-icon"] }
core-scanner = { path = "../../../crates/core-scanner" }
quarantine = { path = "../../../crates/quarantine" }
rfd = "0.17"
sysinfo = { version = "0.30", features = [] }
tauri-plugin-notification = "2"
